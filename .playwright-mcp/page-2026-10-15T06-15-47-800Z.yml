            - paragraph [ref=e96]:
              - strong [ref=e97]: "Q:"
              - text: Why am I being asked to go through this identity verification process?
            - paragraph [ref=e98]:
              - strong [ref=e99]: "A:"
              - text: As part of continuous efforts to improve the security of the DoorDash platform, we have implemented an identity verification process to help ensure that you are you.
            - paragraph [ref=e100]:
              - strong [ref=e101]: "Q:"
              - text: When will I need to complete identity verification?
            - paragraph [ref=e102]:
              - strong [ref=e103]: "A:"
              - text: You will be asked to verify your identity during the sign-up process. You may also be prompted to verify your identity before a dash.
            - paragraph [ref=e104]:
              - strong [ref=e105]: "Q:"
              - text: How does identity verification work?
            - paragraph [ref=e106]:
              - strong [ref=e107]: "A:"
              - text: To confirm your identity in a secure way, DoorDash has partnered with
              - link "Persona" [ref=e108] [cursor=pointer]:
                - /url: http://withpersona.com/
              - text: on this verification process. In order to keep your personal information and account secure, DoorDash will only ask you to verify your identity through the Dasher app or our partnered third-party vendor,
              - link "Persona" [ref=e109] [cursor=pointer]:
                - /url: http://withpersona.com/
              - text: ". When prompted, you may go through one of two types of identity verification:"
            - list [ref=e110]:
              - listitem [ref=e111]:
                - paragraph [ref=e112]: Full identity verification
              - listitem [ref=e113]:
                - paragraph [ref=e114]: Partial re-verification
            - paragraph [ref=e115]: "For full identity verification, you will go through two sequential steps:"
            - list [ref=e116]:
              - listitem [ref=e117]:
                - paragraph [ref=e118]: Upload a valid government ID
              - listitem [ref=e119]:
                - paragraph [ref=e120]: Take a selfie to match the picture on the ID
            - paragraph [ref=e121]: "For partial reverification, you will go through one step:"
            - list [ref=e122]:
              - listitem [ref=e123]:
                - paragraph [ref=e124]: Take a selfie to match pictures you have previously submitted to confirm your identity
            - paragraph [ref=e125]: If you fail any of these steps, you will be given the option to try again. After several failed attempts, however, you will be considered to have failed the identity verification process. You will be unable to proceed with either your sign up process or the ability to continue dashing.
            - paragraph [ref=e126]: Please do not submit any personal information about yourself to anyone claiming to be from DoorDash or Persona, and do not respond to any communications from anyone other than DoorDash or Persona.
            - paragraph [ref=e127]:
              - strong [ref=e128]: "Q:"
              - text: How is my ID and selfie information used and stored?
            - paragraph [ref=e129]:
              - strong [ref=e130]: "A:"
              - text: Your information - including your biometric data - will be stored by DoorDash or its vendors such as Persona for purposes of identity verification. Your data will be permanently deleted after it is no longer necessary.
            - paragraph [ref=e131]:
              - text: For more information about how we keep your data secure, please visit our
              - link "Privacy Policy" [ref=e132] [cursor=pointer]:
                - /url: /en-us/legal/article/cx-privacy-policy
              - text: .
            - paragraph [ref=e133]:
              - strong [ref=e134]: "Q:"
              - text: What kind of ID do I need?
            - paragraph [ref=e135]:
              - strong [ref=e136]: "A:"
              - text: "At this time, you are required to use a current and valid US government-issued ID:"
            - list [ref=e137]:
              - listitem [ref=e138]:
                - paragraph [ref=e139]: Driver’s License
              - listitem [ref=e140]:
                - paragraph [ref=e141]: State ID
              - listitem [ref=e142]:
                - paragraph [ref=e143]: Passport
              - listitem [ref=e144]:
                - paragraph [ref=e145]: Passport Card
              - listitem [ref=e146]:
                - paragraph [ref=e147]: Permanent Resident Card
              - listitem [ref=e148]:
                - paragraph [ref=e149]: Employment Authorization Card
            - paragraph [ref=e150]: "The following IDs will not be accepted:"
            - list [ref=e151]:
              - listitem [ref=e152]:
                - paragraph [ref=e153]: Any expired ID
              - listitem [ref=e154]:
                - paragraph [ref=e155]: Non-US ID
              - listitem [ref=e156]:
                - paragraph [ref=e157]: US non-government-issued ID (school ID, bank card, company badge, etc.)
              - listitem [ref=e158]:
                - paragraph [ref=e159]: Social Security card
              - listitem [ref=e160]:
                - paragraph [ref=e161]: Temporary paper Driver’s License or State ID
              - listitem [ref=e162]:
                - paragraph [ref=e163]: Any photocopies, electronic replicas, or screenshots
              - listitem [ref=e164]:
                - paragraph [ref=e165]: License plate
            - paragraph [ref=e166]:
              - strong [ref=e167]: "Q:"
              - text: What happens if I don’t complete the verification process?
            - paragraph [ref=e168]:
              - strong [ref=e169]: "A:"
              - text: Until you finish verifying your identity, you will not be able to move forward with the sign-up process or continue dashing. If you cancel the verification process at any point in the process, your progress will not be saved. If you want to resume later, you will have to start the identity verification process from the beginning.
            - paragraph [ref=e170]:
              - strong [ref=e171]: "Q:"
              - text: What happens if I fail the verification process?
            - paragraph [ref=e172]:
              - strong [ref=e173]: "A:"
              - text: "If you cannot successfully verify your identity, there are some possible outcomes:"
            - list [ref=e174]:
              - listitem [ref=e175]:
                - paragraph [ref=e176]: If you fail identity verification during the signup process, you will not be able to move forward with the sign-up process.
              - listitem [ref=e177]:
                - paragraph [ref=e178]: When signing up as a Dasher for the first time we recommend avoiding public devices such as school libraries, public libraries, or any open-access computer or device when signing up as the account will be flagged as highly risky due to this shared device association, and sign up will be blocked (To avoid this from happening we suggest only signing up on a personal device such as a phone, laptop, or tablet not in use by anyone else).
              - listitem [ref=e179]:
                - paragraph [ref=e180]: If you fail identity verification after activation, or at any time before a dash, you will no longer be able to dash. However, you will be able to access the Dasher app and certain parts of your accounts, including earnings.
            - paragraph [ref=e181]:
              - strong [ref=e182]: "Q:"
              - text: What suggestions do you have to help me verify?
            - paragraph [ref=e183]:
              - strong [ref=e184]: "A:"
              - text: "You can verify by following the suggestions mentioned below:"
            - paragraph [ref=e185]:
              - strong [ref=e186]: "For a Government ID:"
            - list [ref=e187]:
              - listitem [ref=e188]:
                - paragraph [ref=e189]: Make sure the text on the ID is clear and readable
              - listitem [ref=e190]:
                - paragraph [ref=e191]: Make sure the photo of your face on the ID is visible
              - listitem [ref=e192]:
                - paragraph [ref=e193]: Reduce glare by moving away from direct light
              - listitem [ref=e194]:
                - paragraph [ref=e195]: Make sure the ID is not cutoff or obstructed by your finger
              - listitem [ref=e196]:
                - paragraph [ref=e197]: Make sure the image is not blurry
              - listitem [ref=e198]:
                - paragraph [ref=e199]: Try another ID document type if available
            - paragraph [ref=e200]:
              - strong [ref=e201]: "For a Self Video:"
            - list [ref=e202]:
              - listitem [ref=e203]:
                - paragraph [ref=e204]: Take off your glasses
              - listitem [ref=e205]:
                - paragraph [ref=e206]: Reduce glare by moving away from direct light
              - listitem [ref=e207]:
                - paragraph [ref=e208]: Make sure your face is visible and well lit
              - listitem [ref=e209]:
                - paragraph [ref=e210]: Make sure you turn your face left and right
            - paragraph [ref=e211]:
              - strong [ref=e212]: "Q:"
              - text: How do I enable camera permissions?
            - paragraph [ref=e213]:
              - strong [ref=e214]: "A:"
              - text: If you've received the below message during the Persona verification flow, you'll need to enable the correct camera permissions for your browser and/or device.
            - 'img "Migrated from Salesforce: https://figment.file.force.com/dashers/servlet/rtaImage?eid=ka0Kd000001ZOY4&feoid=00N2L00000AWqPe&refid=0EMKd000002eJQT" [ref=e216]'
            - paragraph [ref=e217]: Here are some ways to enable camera permissions in different browsers and different devices.
            - paragraph [ref=e218]: "1. If you're on Chrome, please follow the steps in the relevant link below:"
            - list [ref=e219]:
              - listitem [ref=e220]:
                - paragraph [ref=e221]:
                  - link "For Desktop" [ref=e222] [cursor=pointer]:
                    - /url: http://support.google.com/chrome/answer/2693767?co=GENIE.Platform%3DDesktop&hl=en&oco=0
              - listitem [ref=e223]:
                - paragraph [ref=e224]:
                  - link "For iPhone & iPad" [ref=e225] [cursor=pointer]:
                    - /url: http://support.google.com/chrome/answer/2693767?co=GENIE.Platform%3DiOS&hl=en&oco=0
              - listitem [ref=e226]:
                - paragraph [ref=e227]:
                  - link "For Android" [ref=e228] [cursor=pointer]:
                    - /url: http://support.google.com/chrome/answer/2693767?co=GENIE.Platform%3DAndroid&hl=en&oco=0
            - paragraph [ref=e229]: "2. If you're on Firefox, please follow the steps in the link below:"
            - list [ref=e230]:
              - listitem [ref=e231]:
                - paragraph [ref=e232]:
                  - link "For Mobile or Desktop" [ref=e233] [cursor=pointer]:
                    - /url: http://support.mozilla.org/en-US/kb/how-manage-your-camera-and-microphone-permissions#w_using-firefoxaos-address-bar-to-clear-camera-or-microphone-permissions-for-a-site
            - paragraph [ref=e234]: "3. If you're on Safari, please follow the relevant steps below:"
            - list [ref=e235]:
              - listitem [ref=e236]:
                - paragraph [ref=e237]:
                  - link "For Desktop" [ref=e238] [cursor=pointer]:
                    - /url: http://support.apple.com/guide/safari/websites-ibrwe2159f50/13.0/mac/10.15
              - listitem [ref=e239]:
                - paragraph [ref=e240]: "For mobile devices below iOS 13, check your \"Camera & Microphone Access\" in your Settings:"
                - list [ref=e241]:
                  - listitem [ref=e242]:
                    - paragraph [ref=e243]: Go to Settings on your device
                  - listitem [ref=e244]:
                    - paragraph [ref=e245]: Scroll down and open Safari
                  - listitem [ref=e246]:
                    - paragraph [ref=e247]: Ensure "Camera" is set to "Ask" or "Allow"
              - listitem [ref=e248]:
                - paragraph [ref=e249]: For mobile devices on iOS 13, tap the "AA" icon in URL bar in the top left. Then tap "Website Settings", which will enable you to set camera permissions to "Allow or Ask" instead of "Deny".
            - paragraph [ref=e250]: "4. If you're on Microsoft Edge, please follow the steps in the link below:"
            - list [ref=e251]:
              - listitem [ref=e252]:
                - paragraph [ref=e253]:
                  - link "For Desktop" [ref=e254] [cursor=pointer]:
                    - /url: http://support.microsoft.com/en-us/help/4468232/windows-10-camera-microphone-and-privacy
            - paragraph [ref=e255]: "5. If you're viewing the Persona verification flow via an iOS or Android app, check your device settings:"
            - list [ref=e256]:
              - listitem [ref=e257]:
                - paragraph [ref=e258]: Go to Settings on your device
              - listitem [ref=e259]:
                - paragraph [ref=e260]: Go to Apps
              - listitem [ref=e261]:
                - paragraph [ref=e262]: Find the app that you wish to enable camera permissions for
              - listitem [ref=e263]:
                - paragraph [ref=e264]: Find the App Settings and allow camera permissions
            - paragraph [ref=e265]:
              - strong [ref=e266]: "Q:"
              - text: What are tips for submitting a photo of my government ID?
            - paragraph [ref=e267]:
              - strong [ref=e268]: "A:"
              - text: "Here are some tips to help you submit a photo of your government ID:"
            - paragraph [ref=e269]: 1. Select the correct ID type that corresponds with your ID.
            - list [ref=e270]:
              - listitem [ref=e271]:
                - paragraph [ref=e272]: You must use a US government-issued ID (Drivers’ License, State ID, Passport & Passport Card)
              - listitem [ref=e273]:
                - paragraph [ref=e274]: The ID you submit must match the ID type selected in order to pass verification. Note that both Passport Cards and Passports can be submitted under "Passport."
            - paragraph [ref=e275]: "2. Take a clear photo of your Government ID:"
            - paragraph [ref=e276]:
              - strong [ref=e277]: "General Tips:"
            - list [ref=e278]:
              - listitem [ref=e279]:
                - paragraph [ref=e280]: Make sure the lighting in the room is bright enough to capture the ID.
              - listitem [ref=e281]:
                - paragraph [ref=e282]: If there is glare in your photo, move away from direct light to reduce glare.
              - listitem [ref=e283]:
                - paragraph [ref=e284]: Make sure the text on your ID is readable (and not worn).
              - listitem [ref=e285]:
                - paragraph [ref=e286]: Make sure you are not covering any part of the ID (e.g. with your finger).
              - listitem [ref=e287]:
                - paragraph [ref=e288]: Make sure the photo of your face on the ID is visible.
              - listitem [ref=e289]:
                - paragraph [ref=e290]: Make sure the image is not blurry.
              - listitem [ref=e291]:
                - paragraph [ref=e292]: If your ID continues to fail, try another ID type if available.
              - listitem [ref=e293]:
                - paragraph [ref=e294]: If your camera quality is poor (e.g. the image is grainy or small) or you do not have a camera on your device, you can upload a photo of your ID and make sure it meets the above requirements. You can also text message or e-mail yourself a link to continue on your phone with your phone's camera.
            - paragraph [ref=e295]:
              - strong [ref=e296]: "For ID Cards:"
            - list [ref=e297]:
              - listitem [ref=e298]:
                - paragraph [ref=e299]: If possible, place the ID card on a flat surface (e.g. a table) with a dark background to reduce blur.
              - listitem [ref=e300]:
                - paragraph [ref=e301]: Move the ID card as close to the camera as possible, while making sure all four corners of the ID are captured within the photo.
            - paragraph [ref=e302]:
              - strong [ref=e303]: "For Passports:"
            - list [ref=e304]:
              - listitem [ref=e305]:
                - paragraph [ref=e306]: Hold the passport open to the main passport page (showing your photo and personal details).
              - listitem [ref=e307]:
                - paragraph [ref=e308]: Make sure you are not blocking any part of the main passport page.
              - listitem [ref=e309]:
                - paragraph [ref=e310]: Make sure the MRZ (the symbols and letters at the bottom of your passport page) is fully visible and can be read clearly in your photo.
              - listitem [ref=e311]:
                - paragraph [ref=e312]: Because passport pages can be glossy, please make sure the lighting is good and move away from a direct lighting source to avoid glare or reflection.
