                - paragraph [ref=e87]: What happens if I don’t complete the verification process?
              - listitem [ref=e88]:
                - paragraph [ref=e89]: What happens if I fail the verification process?
              - listitem [ref=e90]:
                - paragraph [ref=e91]: What suggestions do you have to help me verify?
              - listitem [ref=e92]:
